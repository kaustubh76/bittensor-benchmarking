[project]
name = "acr"
version = "0.1.0"
description = "ACR — The Arc Compute Rate: a manipulation-resistant benchmark family for machine commerce"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "acr-core",
    "acr-sim",
    "acr-tape",
    "acr-estimator",
    "acr-instrument",
    "acr-oracle-client",
    "acr-index-api",
    "acr-subnet",
]

[project.optional-dependencies]
# Live Circle Developer-Controlled Wallets signing for the oracle poster
# (custodied EIP-712 signing instead of a raw ACR_POSTER_PRIVATE_KEY). Re-exposes
# the acr-oracle-client extra so the documented `uv sync --extra circle` works
# from the workspace root. The SDK is lazy-imported — this stays optional.
circle = ["acr-oracle-client[circle]"]

# Google Cloud Model Armor — the middleware screen for agent-to-agent traffic.
# `google-auth` only: Model Armor is IAM-gated and rejects API keys, so what is
# needed is a bearer token from a service account, not a client SDK. The REST
# surface is two methods, and hand-writing them against `requests` keeps this
# extra to one dependency instead of pulling the whole google-cloud stack.
#
# Optional because the screen has a local, deterministic fallback and because the
# base image must stay deployable with no GCP credentials at all — same contract
# as `circle` above.
armor = ["google-auth>=2.35"]

# The real Bittensor SDK, for running ACR as an actual subnet rather than an
# in-process simulation. Re-exposes the acr-subnet extra so the documented
# `uv sync --extra bittensor` works from the workspace root. Lazy-imported, so
# the base install and CI never need it.
bittensor = ["acr-subnet[bittensor]"]

[tool.uv.sources]
acr-core = { workspace = true }
acr-sim = { workspace = true }
acr-tape = { workspace = true }
acr-estimator = { workspace = true }
acr-instrument = { workspace = true }
acr-oracle-client = { workspace = true }
acr-index-api = { workspace = true }
acr-subnet = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Header() defaults are the idiomatic pattern.
# UP042: (str, Enum) is intentional for pydantic-friendly string enums.
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
python_files = ["test_*.py"]
addopts = "-q --import-mode=importlib"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
